name: CI
on:
  push: { branches: [main] }
  pull_request:
  release: { types: [published] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet build StitchDB.sln -c Release
      # Unit + contract tests run without a server; E2E tests need a local stack (`stitchdb start`).
      - run: dotnet test StitchDB.sln -c Release --no-build --filter "TestCategory!=E2E"
  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet build StitchDB.sln -c Release
      - run: dotnet pack StitchDB.sln -c Release --no-build -o out
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
